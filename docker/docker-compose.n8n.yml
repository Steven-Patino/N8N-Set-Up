# Servicio principal de n8n
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    # Conecta el contenedor a la red personalizada para comunicación con PostgreSQL
    networks:
      - n8n_net
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Zona horaria para el contenedor y n8n
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      # Permite que n8n escuche en todas las interfaces del contenedor
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      # URL pública base usada por webhooks y llamadas externas
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      # Configuración de PostgreSQL (exclusiva de este proyecto)
      - DB_TYPE=${DB_TYPE:-postgresdb}
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST:-postgres}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=${DB_POSTGRESDB_SCHEMA}
      # N8N_ENCRYPTION_KEY puede habilitarse en docker/.env para entornos persistentes
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
    name: n8n_data

networks:
  n8n_net:
    name: n8n_net
    external: true